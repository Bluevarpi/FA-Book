<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#174a7e"/>
    </linearGradient>
    <linearGradient id="v1" x1="0" x2="1"><stop offset="0" stop-color="#2c7bc4"/><stop offset="1" stop-color="#175a9b"/></linearGradient>
    <linearGradient id="v2" x1="0" x2="1"><stop offset="0" stop-color="#218c74"/><stop offset="1" stop-color="#126c5a"/></linearGradient>
    <linearGradient id="v3" x1="0" x2="1"><stop offset="0" stop-color="#c96d24"/><stop offset="1" stop-color="#9c4f15"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".24"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#dcecff"/>
    </marker>
  </defs>
  <rect width="1500" height="500" rx="36" fill="url(#bg)"/>
  <text x="70" y="78" fill="#ffffff" font-size="38" font-family="Noto Sans CJK SC, sans-serif" font-weight="700">泛函分析：三卷学习架构</text>
  <text x="70" y="118" fill="#cfe8ff" font-size="21" font-family="Noto Sans CJK SC, sans-serif">依赖闭合 · 40 章 · 从线性核心到 PDE 与非线性变分方法</text>

  <g>
    <rect x="70" y="175" width="400" height="190" rx="22" fill="#185a91" stroke="#62b4f0" stroke-width="2"/>
    <rect x="550" y="175" width="400" height="190" rx="22" fill="#176d5c" stroke="#5ed0a7" stroke-width="2"/>
    <rect x="1030" y="175" width="400" height="190" rx="22" fill="#8d4e22" stroke="#efaa68" stroke-width="2"/>
  </g>

  <g font-family="Noto Sans CJK SC, sans-serif" fill="#ffffff">
    <text x="105" y="225" font-size="26" font-weight="700">第一卷 · 线性泛函分析核心</text>
    <text x="105" y="270" font-size="20">Banach / Hilbert · 对偶 · 弱拓扑</text>
    <text x="105" y="310" font-size="20">有界算子 · 谱 · 紧算子</text>
    <text x="105" y="343" font-size="17" fill="#dcecff">I-01 — I-14</text>

    <text x="585" y="225" font-size="24" font-weight="700">第二卷 · 高级线性理论与 PDE</text>
    <text x="585" y="270" font-size="20">C* 代数 · 无界算子 · 半群</text>
    <text x="585" y="310" font-size="20">分布 · Sobolev · 椭圆型 PDE</text>
    <text x="585" y="343" font-size="17" fill="#e2fff5">II-01 — II-15</text>

    <text x="1065" y="225" font-size="26" font-weight="700">第三卷 · 非线性与变分</text>
    <text x="1065" y="270" font-size="20">隐函数定理 · 拓扑度 · 单调算子</text>
    <text x="1065" y="310" font-size="20">直接法 · Ekeland · 山路定理</text>
    <text x="1065" y="343" font-size="17" fill="#fff1df">III-01 — III-11</text>
  </g>

  <path d="M490 270 H530" stroke="#dcecff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M970 270 H1010" stroke="#dcecff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <text x="70" y="438" fill="#b9d8f5" font-size="19" font-family="Noto Sans CJK SC, sans-serif">建议路线：A级主干 → B/C级支撑 → 专题纵向串联 → 主动重写证明与习题</text>
</svg>
