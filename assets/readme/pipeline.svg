<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="310" viewBox="0 0 1500 310">
  <defs>
    <linearGradient id="pbg" x1="0" x2="1"><stop offset="0" stop-color="#f6f9fc"/><stop offset="1" stop-color="#edf5ff"/></linearGradient>
    <marker id="pArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#738aa3"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1498" height="308" rx="30" fill="url(#pbg)" stroke="#cbdcf0" stroke-width="2"/>
  <text x="70" y="65" fill="#123b66" font-family="Noto Sans CJK SC, sans-serif" font-weight="700" font-size="34">四遍学习路线</text>

  <g font-family="Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <g>
      <circle cx="180" cy="185" r="66" fill="#3478d4"/>
      <text x="180" y="178" fill="#fff" font-size="24" font-weight="700">第 1 遍</text>
      <text x="180" y="212" fill="#fff" font-size="23">骨架</text>
    </g>
    <g>
      <circle cx="560" cy="185" r="66" fill="#15956e"/>
      <text x="560" y="178" fill="#fff" font-size="24" font-weight="700">第 2 遍</text>
      <text x="560" y="212" fill="#fff" font-size="23">证明</text>
    </g>
    <g>
      <circle cx="940" cy="185" r="66" fill="#d58a18"/>
      <text x="940" y="178" fill="#fff" font-size="24" font-weight="700">第 3 遍</text>
      <text x="940" y="212" fill="#fff" font-size="23">专题</text>
    </g>
    <g>
      <circle cx="1320" cy="185" r="66" fill="#7252c8"/>
      <text x="1320" y="178" fill="#fff" font-size="24" font-weight="700">第 4 遍</text>
      <text x="1320" y="212" fill="#fff" font-size="23">输出</text>
    </g>
  </g>

  <g stroke="#738aa3" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#pArrow)">
    <path d="M262 185 H470"/>
    <path d="M642 185 H850"/>
    <path d="M1022 185 H1230"/>
